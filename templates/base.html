<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Personal.Rec{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <header class="header">
        <a href="{{ url_for('index') }}" class="logo">
            Personal<span>.Rec</span>
        </a>

        <nav class="navigation">
            <a href="{{ url_for('index') }}">Поиск</a>
            <a href="{{ url_for('register') }}" class="login-link">
                Войти
            </a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
